<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPEEDTEXT · письмо</title>
<style>
  body { margin: 0; padding: 24px 16px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #efeee9; color: #121210; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #6b6a64; line-height: 1.4; }
  .btn { display: block; width: 100%; box-sizing: border-box; padding: 16px; border-radius: 16px; border: 1px solid #121210; background: #121210; color: #fff; font-family: inherit; font-size: 17px; font-weight: 600; text-align: center; text-decoration: none; margin: 12px 0; cursor: pointer; }
  .btn.light { background: #fff; color: #121210; border-color: #dcdbd5; }
  pre { white-space: pre-wrap; background: #fff; border-radius: 14px; padding: 14px; font-family: inherit; font-size: 14px; line-height: 1.4; color: #121210; }
</style>
</head>
<body>
<h1>Письмо в SPEEDTEXT</h1>
<p id="hint">Нажмите кнопку, откроется ваша почта с готовым письмом.</p>
<a id="open" class="btn" href="#">Открыть почту</a>
<button id="copy" class="btn light" type="button">Скопировать адрес и текст</button>
<pre id="text"></pre>
<script>
  // Страница-посредник для мини-приложения: внутри Telegram ссылка mailto не открывается, а из браузера — да.
  // Письмо приходит после #, на сервер не уходит. Принимаем только письма на адрес поддержки.
  var SUPPORT = "Ektb66@bk.ru";
  var mailto = "";
  try { mailto = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (mailto.toLowerCase().indexOf("mailto:" + SUPPORT.toLowerCase()) !== 0) mailto = "mailto:" + SUPPORT;
  var q = new URLSearchParams(mailto.split("?")[1] || "");
  var plain = SUPPORT + "\n" + (q.get("subject") || "") + "\n\n" + (q.get("body") || "");
  document.getElementById("text").textContent = plain;
  document.getElementById("open").href = mailto;
  document.getElementById("copy").onclick = function () {
    navigator.clipboard.writeText(plain).then(function () {
      document.getElementById("copy").textContent = "Скопировано — вставьте в письмо";
    });
  };
  setTimeout(function () { location.href = mailto; }, 300);
</script>
</body>
</html>
